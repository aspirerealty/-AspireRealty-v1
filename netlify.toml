# Netlify hosting (temporary — AWS Amplify config lives in amplify.yml).
# The site is a static export, so Netlify just serves the `out/` folder;
# Netlify automatically uses out/404.html for unknown URLs.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for fingerprinted Next.js assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
